name: Order Service CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
    paths:
      - 'order-service/**'
  push:
    branches:
      - main
    paths:
      - 'order-service/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Yahan steps ko sahi se indent (align) kiya hai
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Package With Maven
        run: |
          cd order-service/order-service
          mvn clean package -DskipTests

      # docker-login-actions ki jagah docker-login-action hoga (s hata diya)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          cd order-service/order-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest


