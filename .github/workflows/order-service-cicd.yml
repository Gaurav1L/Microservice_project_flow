name: Order Service CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
    paths:
      - 'order-service/order-service/**' # 🎯 Sahi structural tracking target filter

  push:
    branches:
      - main
    paths:
      - 'order-service/order-service/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 🎯 GitHub runner server ko exact Maven directory location tak bhej kar JAR banana
      - name: Build and Package with Maven
        run: |
          cd order-service/order-service
          mvn clean package -DskipTests

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: actions/docker-login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 🎯 Docker core command build script configuration check layer update
      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        run: |
          cd order-service/order-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest
