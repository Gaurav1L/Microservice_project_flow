name: Order Service CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'order-service/order-service/**' # 🎯 Exact structural path tracking filter matching your repo structure

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Package with Maven
        run: |
          cd order-service/order-service
          mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: actions/docker-login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          cd order-service/order-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest
